name: Bridge motion recording validation
on:
  push:
    paths:
      - extension/**
      - plugin/**
      - package.json
      - tests/motion-capture.test.mjs
      - tests/capture-ux.test.mjs
      - .github/workflows/motion-capture.yml
  pull_request:
    paths:
      - extension/**
      - package.json
      - tests/motion-capture.test.mjs
      - .github/workflows/motion-capture.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned encoder and bundler dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Produce offline-compatible bundled encoder
        run: npm run build:extension
      - name: Run recording regressions
        run: node tests/motion-capture.test.mjs
      - name: Validate all Bridge workflow surfaces
        run: |
          node tests/capture-ux.test.mjs
          node tests/exporter-smoke.mjs
      - name: Validate bundled script exists
        run: test -s extension/recorder.js
      - name: Package Chrome extension and updated Figma companion
        run: |
          mkdir -p dist/extension dist/figma-plugin
          cp extension/manifest.json extension/popup.html extension/popup.js extension/background.js extension/record.html extension/recorder.js extension/README.md dist/extension/
          cp plugin/manifest.json plugin/code.js plugin/ui.html dist/figma-plugin/
          cd dist
          zip -qr figma-bridge-complete-toolkit.zip extension figma-plugin
      - name: Attach installable Bridge toolkit
        uses: actions/upload-artifact@v4
        with:
          name: figma-bridge-complete-toolkit
          path: dist/figma-bridge-complete-toolkit.zip
          if-no-files-found: error
          retention-days: 30
