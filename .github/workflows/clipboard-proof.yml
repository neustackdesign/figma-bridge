name: Bridge converter clipboard acceptance
on:
  push:
    paths:
      - tests/clipboard-smoke.mjs
      - .github/workflows/clipboard-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local isolated public app
        run: |
          python3 -m http.server 3200 --bind 127.0.0.1 > /tmp/bridge-proof.log 2>&1 &
          for i in $(seq 1 25); do if curl -fsS http://127.0.0.1:3200/ >/dev/null; then break; fi; sleep 1; done
      - name: Confirm browser preview produces non-empty Figma clipboard payload
        run: node tests/clipboard-smoke.mjs
      - name: Retain browser proof without implying native Figma paste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figma-bridge-clipboard-fixture-2026-10
          path: tests/clipboard-proof/
          if-no-files-found: warn
          retention-days: 30
