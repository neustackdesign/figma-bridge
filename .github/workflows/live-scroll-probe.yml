name: Bridge live-site scroll compatibility probe
on:
  push:
    paths:
      - tests/live-scroll-probe.mjs
      - .github/workflows/live-scroll-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probe real sites and document their scroll response
        run: node tests/live-scroll-probe.mjs
      - name: Retain website scroll metrics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-live-site-scroll-proof
          path: tests/live-scroll-proof/
          if-no-files-found: warn
          retention-days: 15
